    <!-- Structured Data: FAQPage for AEO (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "@id": "https://cagad.org/#faq",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is CAGAD?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CAGAD (Centre for Advancement of Governance and Development) is an independent, non-profit, non-partisan, and research-centred think tank based in Abuja, Nigeria. It focuses on advancing good governance, democratic accountability, security, and sustainable development in Nigeria and across Africa through evidence-based research, policy advocacy, and stakeholder engagement."
          }
        },
        {
          "@type": "Question",
          "name": "What does CAGAD do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CAGAD engages in research and analysis, policy advisory, policy advocacy, policy dialogue, civic engagement, human capacity building, governance consulting, and stakeholder partnerships to promote national and regional development. The organisation monitors elections, democracy, accountability, and security across African regions, and provides evidence-based policy recommendations to governments and institutions."
          }
        },
        {
          "@type": "Question",
          "name": "What are CAGAD's focus areas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CAGAD focuses on six key areas: (1) Governance – promoting good governance and public leadership integrity; (2) Accountability – monitoring public expenditure and tracking government performance; (3) Security – analysing security incidents and improving human safety; (4) Democracy – deepening democratic consolidation and citizen participation; (5) Peacebuilding – fostering conflict resolution in fragile contexts; and (6) Sustainable Development – promoting the SDGs and inclusive development."
          }
        },
        {
          "@type": "Question",
          "name": "How can I volunteer or join CAGAD?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can volunteer with CAGAD by filling out the application form on the website at cagad.org. The form requires your personal details, skills, areas of interest (such as Research, Advocacy, Community Engagement, Technology & Innovation, Administration, Communications, or Fundraising), and how many hours per week you can commit. For inquiries, email info@cagad.org or call +2349123733985."
          }
        },
        {
          "@type": "Question",
          "name": "Where is CAGAD located?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CAGAD is headquartered in Abuja, Nigeria. You can contact CAGAD via email at info@cagad.org or by phone at +2349123733985."
          }
        },
        {
          "@type": "Question",
          "name": "What programmes does CAGAD run?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CAGAD runs multiple programmes including: Elections Credibility Monitoring, Democracy Monitoring, Accountability Monitoring, Security Monitoring, Civic Engagement, and regional programmes covering West Africa, East Africa, Central Africa, North Africa, Southern Africa, and the Sahel region. It also operates an International Affairs Programme, Nigeria in Africa and the World Programme, Regional Security Programme, and Regional Institutions and Governance Programme."
          }
        },
        {
          "@type": "Question",
          "name": "What is CAGAD's mission?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CAGAD's mission is to promote responsive governance, democratic accountability, and sustainable development. Through evidence-based research, policy advocacy, policy dialogue, and stakeholder collaborations, CAGAD seeks to strengthen governance and policy processes, deepen citizens' participation, enhance evidence-based decision-making, promote inclusive governance, improve human security, and advance sustainable development in Nigeria and Africa."
          }
        },
        {
          "@type": "Question",
          "name": "What is CAGAD's vision?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CAGAD's vision is to become Nigeria and Africa's leading policy organisation, shaping governance, policies, and development processes and outcomes through research, policy advisory, stakeholder engagement, and digital innovation."
          }
        }
      ]
    }
